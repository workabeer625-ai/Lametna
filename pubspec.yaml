name: lametna
description: "لمّتنا — تطبيق ألعاب جماعية نصية عن بُعد. Lametna: realtime social party games."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management & navigation
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.7

  # Backend (Supabase free tier)
  supabase_flutter: ^2.5.6

  # Networking / connectivity
  dio: ^5.5.0
  connectivity_plus: ^6.0.3

  # Storage
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.2.2

  # UI / i18n
  intl: ^0.19.0
  google_fonts: ^6.2.1
  cached_network_image: ^3.3.1

  # Utils
  uuid: ^4.4.0
  collection: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/avatars/
