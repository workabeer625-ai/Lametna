name: lametna
description: "لمّتنا — تطبيق ألعاب جماعية نصية عن بُعد. Lametna: realtime social party games."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management & navigation
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.7

  # Backend (Supabase free tier)
  supabase_flutter: ^2.5.6

  # Networking / connectivity
  dio: ^5.5.0
  connectivity_plus: ^6.0.3

  # Storage
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.2.2

  # UI / i18n
  intl: ^0.20.0
  google_fonts: ^6.2.1
  cached_network_image: ^3.3.1
  url_launcher: ^6.3.0

  # Utils
  uuid: ^4.4.0
  collection: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mocktail: ^1.0.4
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/avatars/

  # خطوط عربية مضمّنة محليًا — لا حاجة لتحميلها من الإنترنت عند أول تشغيل.
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo_400Regular.ttf
          weight: 400
        - asset: assets/fonts/Cairo_500Medium.ttf
          weight: 500
        - asset: assets/fonts/Cairo_600SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Cairo_700Bold.ttf
          weight: 700
        - asset: assets/fonts/Cairo_900Black.ttf
          weight: 900
    - family: Baloo
      fonts:
        - asset: assets/fonts/BalooBhaijaan2_700Bold.ttf
          weight: 700
        - asset: assets/fonts/BalooBhaijaan2_800ExtraBold.ttf
          weight: 800

# أيقونة التطبيق (شعار لمّتنا — فنجان القهوة واللمّة)
# للتوليد:  dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "tool/branding/app_icon.png"
  android: "ic_launcher"
  adaptive_icon_background: "#F7F0E5"
  adaptive_icon_foreground: "tool/branding/app_icon_foreground.png"
  min_sdk_android: 21
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
    background_color: "#F7F0E5"
    theme_color: "#6F4E37"
  windows:
    generate: true
    icon_size: 256
